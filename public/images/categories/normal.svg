<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Zwei Teller mit Essen auf einem gedeckten Tisch">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#FFF8EC"/>
  <circle cx="400" cy="300" r="286" fill="#F8EDDC"/>

  <!-- chairs -->
  <rect x="272" y="24" width="256" height="58" rx="29" fill="#6B7A3A" stroke="#2B2118" stroke-width="7"/>
  <line x1="305" y1="54" x2="495" y2="54" stroke="#2B2118" stroke-width="3" opacity="0.28" stroke-linecap="round"/>
  <rect x="272" y="520" width="256" height="58" rx="29" fill="#6B7A3A" stroke="#2B2118" stroke-width="7"/>
  <line x1="305" y1="550" x2="495" y2="550" stroke="#2B2118" stroke-width="3" opacity="0.28" stroke-linecap="round"/>

  <!-- table -->
  <rect x="66" y="96" width="668" height="428" rx="88" fill="#E8D4B2" stroke="#2B2118" stroke-width="9"/>
  <rect x="94" y="124" width="612" height="372" rx="66" fill="#F3E7D3" stroke="#2B2118" stroke-width="3" opacity="0.22" stroke-dasharray="14 13"/>

  <!-- glasses -->
  <g>
    <rect x="130" y="168" width="46" height="78" rx="12" fill="#FFFDF8" stroke="#2B2118" stroke-width="5"/>
    <path d="M132 205h42v29a10 10 0 0 1-10 10h-22a10 10 0 0 1-10-10z" fill="#BBD3C5"/>
    <rect x="624" y="168" width="46" height="78" rx="12" fill="#FFFDF8" stroke="#2B2118" stroke-width="5"/>
    <path d="M626 205h42v29a10 10 0 0 1-10 10h-22a10 10 0 0 1-10-10z" fill="#BBD3C5"/>
  </g>

  <!-- salad bowl -->
  <g>
    <circle cx="400" cy="188" r="66" fill="#FFFDF8" stroke="#2B2118" stroke-width="6"/>
    <circle cx="400" cy="188" r="52" fill="#E9EDD3"/>
    <path d="M362 184c10-16 26 10 40-4s26 12 38-2" fill="none" stroke="#6B7A3A" stroke-width="11" stroke-linecap="round"/>
    <path d="M366 201c14 10 28-10 44 0s20-4 30 2" fill="none" stroke="#7E8E49" stroke-width="9" stroke-linecap="round"/>
    <circle cx="382" cy="174" r="7" fill="#E8503A"/>
    <circle cx="421" cy="199" r="6" fill="#E8503A"/>
    <circle cx="412" cy="172" r="5" fill="#E0A412"/>
  </g>

  <!-- left plate: pasta -->
  <g>
    <circle cx="262" cy="332" r="104" fill="#FFFDF8" stroke="#2B2118" stroke-width="7"/>
    <circle cx="262" cy="332" r="86" fill="none" stroke="#2B2118" stroke-width="3" opacity="0.16"/>
    <circle cx="262" cy="332" r="71" fill="#F0B429"/>
    <path d="M208 318c18-22 38 16 58-4s36 18 54-4" fill="none" stroke="#E8503A" stroke-width="13" stroke-linecap="round"/>
    <path d="M211 348c22 16 42-14 63 2s30-12 48 2" fill="none" stroke="#C9870C" stroke-width="11" stroke-linecap="round"/>
    <path d="M218 366c18-12 38 12 56-2s30 10 44-2" fill="none" stroke="#E8503A" stroke-width="9" stroke-linecap="round"/>
    <circle cx="238" cy="307" r="12" fill="#7A4A2A" stroke="#2B2118" stroke-width="3"/>
    <circle cx="286" cy="340" r="11" fill="#7A4A2A" stroke="#2B2118" stroke-width="3"/>
    <circle cx="240" cy="365" r="9" fill="#7A4A2A" stroke="#2B2118" stroke-width="3"/>
    <path d="M280 300c10-12 24-6 22 6-10 6-18 3-22-6z" fill="#6B7A3A" stroke="#2B2118" stroke-width="3"/>
  </g>

  <!-- right plate: veggies and rice -->
  <g>
    <circle cx="538" cy="332" r="104" fill="#FFFDF8" stroke="#2B2118" stroke-width="7"/>
    <circle cx="538" cy="332" r="86" fill="none" stroke="#2B2118" stroke-width="3" opacity="0.16"/>
    <circle cx="538" cy="332" r="71" fill="#EFE3C8"/>
    <path d="M489 330c14-18 30 12 48-2s32 16 46-2" fill="none" stroke="#6B7A3A" stroke-width="14" stroke-linecap="round"/>
    <path d="M492 352c18 12 34-12 52 0s24-8 38 2" fill="none" stroke="#7E8E49" stroke-width="10" stroke-linecap="round"/>
    <path d="M502 310c10-12 24-4 26 8" fill="none" stroke="#E0A412" stroke-width="9" stroke-linecap="round"/>
    <circle cx="575" cy="318" r="10" fill="#E8503A" stroke="#2B2118" stroke-width="3"/>
    <circle cx="515" cy="364" r="8" fill="#E8503A" stroke="#2B2118" stroke-width="3"/>
    <path d="M552 352c12-8 22 2 18 14-13 3-21-3-18-14z" fill="#6B7A3A" stroke="#2B2118" stroke-width="3"/>
  </g>

  <!-- cutlery -->
  <g stroke="#2B2118" stroke-width="6" stroke-linecap="round" fill="none">
    <g transform="translate(118 292) rotate(10)">
      <line x1="0" y1="0" x2="0" y2="104"/>
      <path d="M-13 -12v24a8 8 0 0 0 8 8h10a8 8 0 0 0 8-8v-24"/>
      <line x1="-9" y1="-12" x2="-9" y2="8"/>
      <line x1="9" y1="-12" x2="9" y2="8"/>
    </g>
    <g transform="translate(688 292) rotate(-10)">
      <path d="M0 0c14 0 18 12 18 26v78" />
      <path d="M0 0c-10 8-11 22-2 34 6 8 2 18 2 24" fill="#FFFDF8"/>
    </g>
  </g>

  <!-- extras -->
  <g>
    <circle cx="608" cy="420" r="14" fill="#E8503A" stroke="#2B2118" stroke-width="4"/>
    <path d="M604 407c2-8 6-10 10-12" fill="none" stroke="#6B7A3A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="194" cy="252" r="10" fill="#E0A412" stroke="#2B2118" stroke-width="3"/>
    <path d="M330 214c8-10 19-5 18 5-8 5-15 2-18-5z" fill="#6B7A3A" stroke="#2B2118" stroke-width="3"/>
    <path d="M466 214c8-10 19-5 18 5-8 5-15 2-18-5z" fill="#6B7A3A" stroke="#2B2118" stroke-width="3"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:multiply"/>
</svg>
